name: H10Sleep

options:
  bundleIdPrefix: de.jebel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PolarBleSdk:
    url: https://github.com/polarofficial/polar-ble-sdk
    from: 8.6.0
  H10Analysis:
    path: Packages/H10Analysis

targets:
  H10Sleep:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "H10 Sleep & ECG"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "H10 Sleep & ECG benötigt Bluetooth, um sich mit deinem Polar H10 Brustgurt zu verbinden und EKG-, Herzfrequenz-, HRV- und Bewegungsdaten auch im Hintergrund aufzuzeichnen."
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jebel.h10sleep
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: PolarBleSdk
        product: PolarBleSdk
      - package: H10Analysis
        product: H10Analysis

schemes:
  H10Sleep:
    build:
      targets:
        H10Sleep: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
